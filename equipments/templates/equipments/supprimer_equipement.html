{% extends 'equipments/base.html' %}

{% block content %}
<div class="container">
    <h1 class="mt-4 text-danger">Supprimer un équipement</h1>
    <p>Es-tu sûr de vouloir supprimer <strong>{{ equipement.nom }}</strong> ?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer</button>
        <a href="{% url 'liste_equipements' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
