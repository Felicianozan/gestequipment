
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Connexion Technicien</title>
</head>
<body class="bg-gray-100">
  <div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow">
    <h2 class="text-2xl font-bold text-center mb-6">Connexion</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>
        <label class="block text-sm font-medium">Nom d'utilisateur</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium">Mot de passe</label>
        {{ form.password }}
      </div>
      <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Se connecter</button>
    </form>
  </div>
</body>
</html>
