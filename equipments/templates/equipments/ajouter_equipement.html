{% extends 'equipments/base.html' %}

{% block content %}
<div class="container">
    <h1 class="mt-4">Ajouter un équipement</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Ajouter</button>
        <a href="{% url 'liste_equipements' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
